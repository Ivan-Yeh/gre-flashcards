<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRE Word Collection — Card Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f1ead9;
    --paper-dark: #e7dcc3;
    --card: #fbf6e9;
    --ink: #2b2620;
    --ink-soft: #55493a;
    --rule: #c9b892;
    --accent: #8a2b2b;
    --accent-dim: #b5555088;
    --green: #3f5d3a;
    --shadow: rgba(43,38,32,0.28);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #fffaf0 0%, transparent 60%),
      linear-gradient(var(--paper), var(--paper-dark));
    font-family:'Source Serif 4', serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 40px;
  }
  .header{
    width:100%;
    max-width:640px;
    text-align:center;
    margin-bottom:18px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 4px;
  }
  h1{
    font-family:'Special Elite', monospace;
    font-weight:400;
    font-size:26px;
    margin:0;
    letter-spacing:0.01em;
  }
  .subtitle{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
    font-style:italic;
  }

  .drawer{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .stage{
    width:100%;
    perspective:1600px;
  }

  .card{
    position:relative;
    width:100%;
    aspect-ratio: 5 / 3.4;
    min-height: 260px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{ transform: rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:3px;
    box-shadow: 0 10px 0 -6px var(--rule), 0 18px 30px -12px var(--shadow);
    padding:26px 28px;
    display:flex;
    flex-direction:column;
  }
  .face::before{
    content:'';
    position:absolute;
    left:0; right:0; top:44px;
    height:1px;
    background:var(--rule);
  }
  .face.back{ transform:rotateY(180deg); }

  .card-index{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.08em;
    display:flex;
    justify-content:space-between;
  }
  .card-body{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 10px 6px 0;
  }
  .word{
    font-family:'Special Elite', monospace;
    font-size:clamp(28px, 6vw, 42px);
    color:var(--ink);
  }
  .pos-tag{
    display:inline-block;
    margin-top:8px;
    margin-bottom:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    color:var(--accent);
    font-style:italic;
    border:1px solid var(--accent-dim);
    border-radius:2px;
    padding:2px 8px;
  }
  .definition{
    font-size:clamp(16px, 3.6vw, 19px);
    line-height:1.5;
    color:var(--ink);
  }
  .example{
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed var(--rule);
    font-family:'IBM Plex Mono', monospace;
    font-size:clamp(11px, 2.6vw, 12.5px);
    line-height:1.55;
    color:var(--ink-soft);
    font-style:italic;
  }
  .hint{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.65;
  }

  .controls{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  button{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    background:var(--paper-dark);
    color:var(--ink);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:10px 14px;
    cursor:pointer;
    transition: background .15s, transform .1s;
  }
  button:hover{ background:#dccb9f; }
  button:active{ transform:translateY(1px); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); color:#fbf6e9; border-color:var(--accent); }
  .btn-primary:hover{ background:#71201f; }

  .nav-row{ display:flex; gap:8px; }

  .progress-wrap{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .progress-bar{
    flex:1;
    height:5px;
    background:var(--paper-dark);
    border:1px solid var(--rule);
    position:relative;
    overflow:hidden;
  }
  .progress-fill{
    position:absolute; left:0; top:0; bottom:0;
    background:var(--accent);
    width:0%;
    transition:width .2s;
  }

  .toolbar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  select, input[type=text]{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:8px 10px;
    color:var(--ink);
  }
  input[type=text]{ width:140px; }

  .stat-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:5px 9px;
    border:1px solid var(--rule);
    border-radius:2px;
    background:var(--paper-dark);
  }
  .stat-chip.known{ color:var(--green); border-color:var(--green); }
  .stat-chip.review{ color:var(--accent); border-color:var(--accent); }

  .mark-row{ display:flex; gap:8px; }

  footer{
    margin-top:22px;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    text-align:center;
    opacity:0.7;
  }

  @media (max-width:420px){
    .face{ padding:20px; }
  }
</style>
</head>
<body>

<div class="header">
  <p class="eyebrow">Manhattan Prep — Circulation Desk</p>
  <h1>GRE Word Collection</h1>
  <p class="subtitle">A card catalog of 995 words worth knowing</p>
</div>

<div class="drawer">

  <div class="toolbar">
    <div class="mark-row">
      <span class="stat-chip known">Known: <span id="knownCount">0</span></span>
      <span class="stat-chip review">To review: <span id="reviewCount">0</span></span>
    </div>
    <select id="filterSelect">
      <option value="all">All cards</option>
      <option value="unmarked">Unmarked only</option>
      <option value="review">Marked: review</option>
      <option value="known">Marked: known</option>
    </select>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="card-index"><span id="idxFront">001 / 995</span><span>A–Z</span></div>
        <div class="card-body">
          <div>
            <div class="word" id="wordFront"></div>
            <div style="text-align:center;"><span class="pos-tag" id="posFront"></span></div>
          </div>
        </div>
        <div class="hint">tap card to reveal definition</div>
      </div>
      <div class="face back">
        <div class="card-index"><span id="idxBack">001 / 995</span><span id="wordBack"></span></div>
        <div class="card-body">
          <div>
            <div class="definition"><span class="pos-tag" id="posBack"></span><br>
              <span id="defBack"></span>
            </div>
            <div class="example" id="exBack"></div>
          </div>
        </div>
        <div class="hint">tap to flip back</div>
      </div>
    </div>
  </div>

  <div class="progress-wrap">
    <span id="posLabel">1</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="totalLabel">995</span>
  </div>

  <div class="controls">
    <div class="nav-row">
      <button id="prevBtn">&larr; Prev</button>
      <button id="shuffleBtn">Shuffle</button>
      <button id="nextBtn">Next &rarr;</button>
    </div>
  </div>

  <div class="controls">
    <button id="reviewBtn">Mark: review</button>
    <button id="knownBtn" class="btn-primary">Mark: known</button>
  </div>

  <div class="toolbar">
    <div style="display:flex; gap:8px; align-items:center;">
      <input type="text" id="jumpInput" placeholder="Jump to word or #">
      <button id="jumpBtn">Go</button>
    </div>
    <button id="resetBtn">Reset marks</button>
  </div>

</div>

<footer>Manhattan Prep 1000 GRE Words · use ← → to navigate, space to flip</footer>

<script>
const WORDS = [{"w":"abase","pos":"v.","d":"Degrade or humble; to lower in rank, status, or esteem","ex":"He refused to abase himself by begging for his old job back."},{"w":"abate","pos":"v.","d":"Reduce, diminish","ex":"The storm showed no sign of abating before midnight."},{"w":"abdicate","pos":"v.","d":"Formally give up the throne (or some other power or responsibility)","ex":"The king chose to abdicate rather than fight the rebellion."},{"w":"aberrant","pos":"n., adj.","d":"Abnormal, deviant","ex":"The scientist flagged the aberrant reading as a possible instrument error."},{"w":"abeyance","pos":"n.","d":"Temporary suspension, inactivity","ex":"The lawsuit was held in abeyance until the merger was finalized."},{"w":"abhor","pos":"v.","d":"Detest, regard with disgust","ex":"She abhors dishonesty in any form, even small white lies."},{"w":"abjure","pos":"v.","d":"Give up, renounce; repudiate, recant, or shun (especially formally or under oath)","ex":"He publicly abjured the extremist views of his youth."},{"w":"abrasive","pos":"adj., n.","d":"Rough, suitable for grinding or polishing (such as sandpaper); causing irritation or annoyance","ex":"His abrasive manner made him unpopular with new coworkers."},{"w":"abreast","pos":"adj., adv.","d":"Side-by-side. The more common \"abreast of\" means keeping up with, staying aware of, or remaining equal in progress with.","ex":"The committee tries to stay abreast of changes in the law."},{"w":"abridge","pos":"v.","d":"Reduce or lessen; shorten by omitting parts throughout while retaining the main idea","ex":"The editor had to abridge the novel for the school edition."},{"w":"abscission","pos":"n.","d":"Cutting off; sudden termination; the separation of leaves, petals, or other parts from a plant or animal","ex":"Abscission causes the leaves to drop from the tree each autumn."},{"w":"abscond","pos":"v.","d":"Depart suddenly and secretively","ex":"The treasurer absconded with the club's funds overnight."},{"w":"abstain","pos":"v.","d":"Hold back, refrain (especially from something bad or unhealthy); decline to vote","ex":"Two senators chose to abstain rather than vote either way."},{"w":"abyss","pos":"n.","d":"A deep and vast space or cavity; anything profound or infinite","ex":"The hikers peered nervously into the abyss below the cliff."},{"w":"accede","pos":"v.","d":"Agree, give consent; assume power (usually as \"accede to\")","ex":"After hours of pressure, the board finally acceded to the demands."},{"w":"accretion","pos":"n.","d":"Gradual increase; an added part or addition","ex":"The reef grew slowly through the accretion of coral over centuries."},{"w":"acerbic","pos":"adj.","d":"Sour; harsh or severe","ex":"Her acerbic wit made even her compliments sound like insults."},{"w":"acidulous","pos":"adj.","d":"Slightly acid or sour; sharp or caustic","ex":"The wine had an acidulous edge that surprised the tasters."},{"w":"acme","pos":"n.","d":"Summit, peak, highest point","ex":"Winning the championship marked the acme of her career."},{"w":"activism","pos":"n.","d":"The practice of pursuing political or other goals through vigorous action, often including protests and demonstrations","ex":"Her activism helped push the city council toward cleaner energy."},{"w":"acumen","pos":"n.","d":"Keen, quick, accurate insight or judgment","ex":"His financial acumen helped the startup survive its first year."},{"w":"adhere","pos":"v.","d":"Stick (to), such as with glue, or to a plan or belief","ex":"Please adhere to the guidelines outlined in the syllabus."},{"w":"admonish","pos":"v.","d":"Mildly scold; caution, advise, or remind to do something","ex":"The teacher gently admonished the student for talking during the exam."},{"w":"adulterate","pos":"v., adj.","d":"Make impure by adding inappropriate or inferior ingredients","ex":"The company was fined for adulterating its olive oil with cheaper oils."},{"w":"adumbrate","pos":"v.","d":"Give a rough outline of; foreshadow; reveal only partially; obscure","ex":"The opening scene adumbrates the tragedy that follows."},{"w":"adverse","pos":"adj.","d":"Opposing, harmful","ex":"The medication can have adverse effects if taken with alcohol."},{"w":"advocate","pos":"v., n.","d":"Speak or argue in favor of (verb); a person who pleads for a cause or on behalf of another person (noun)","ex":"She works as an advocate for tenants facing eviction."},{"w":"aerie","pos":"n.","d":"Dwelling or fortress built on a high place; the nest of a bird of prey, such as an eagle or hawk, built on a mountain or cliff","ex":"The eagle built its aerie high on the cliff face."},{"w":"aesthetic","pos":"adj., n.","d":"Concerning the appreciation of beauty or good taste, pertaining to the science of what is beautiful (adj); a sense of beauty and taste of a particular time and place (noun)","ex":"The restaurant's minimalist aesthetic drew praise from design critics."},{"w":"affable","pos":"adj.","d":"Warm and friendly, pleasant, approachable","ex":"The new manager was affable and quick to laugh."},{"w":"affectation","pos":"n.","d":"Fake behavior (such as in speech or dress) adopted to give a certain impression","ex":"His British accent turned out to be an affectation, not his real voice."},{"w":"aggrandize","pos":"v.","d":"Make greater; exaggerate","ex":"The memoir seemed written mainly to aggrandize the author's own role."},{"w":"aggregate","pos":"v., adj.","d":"Gather together, amount to (verb); constituting a whole made up of constituent parts (adj)","ex":"The report presents aggregate sales data for the entire region."},{"w":"alacrity","pos":"n.","d":"Cheerful or speedy willingness","ex":"She accepted the challenge with surprising alacrity."},{"w":"albeit","pos":"conj.","d":"Although, even though","ex":"The plan worked, albeit more slowly than anyone expected."},{"w":"alienate","pos":"v.","d":"Cause to become unfriendly, hostile, or distant","ex":"The policy risks alienating longtime customers."},{"w":"alleviate","pos":"v.","d":"Lessen, make easier to endure","ex":"The new bridge should alleviate traffic on the old route."},{"w":"aloof","pos":"adj., adv.","d":"Distant physically or emotionally; reserved; indifferent","ex":"He remained aloof at the party, barely speaking to anyone."},{"w":"amalgamate","pos":"v., adj.","d":"Blend, merge, or unite","ex":"The two departments were amalgamated into a single division."},{"w":"ambiguous","pos":"adj.","d":"Not clear, hard to understand, open to having several meanings or interpretations","ex":"The instructions were so ambiguous that no one knew where to start."},{"w":"ambivalent","pos":"adj.","d":"Uncertain; unable to decide, or wanting to do two contradictory things at once","ex":"She felt ambivalent about moving, excited yet reluctant to leave."},{"w":"ameliorate","pos":"v.","d":"Improve; make better or more bearable","ex":"The new policies were designed to ameliorate working conditions in the factory."},{"w":"amortize","pos":"v.","d":"Gradually pay off a debt, or gradually write off an asset","ex":"The company amortizes the cost of the equipment over ten years."},{"w":"anachronism","pos":"n.","d":"Something that is not in its correct historical time; a mistake in chronology, such as by assigning a person or event to the wrong time period","ex":"The wristwatch in the medieval film is an obvious anachronism."},{"w":"analgesia","pos":"n.","d":"Pain relief; inability to feel pain","ex":"The drug provides analgesia without causing drowsiness."},{"w":"analogous","pos":"adj.","d":"Comparable, corresponding in some particular way (making a good analogy)","ex":"Running a household budget is analogous to managing a small business."},{"w":"anarchy","pos":"n.","d":"Absence of law or government; chaos, disorder","ex":"The collapse of the government plunged the region into anarchy."},{"w":"annul","pos":"v.","d":"Make void or null, cancel, abolish (usually of laws or other established rules)","ex":"The court moved to annul the contract after discovering the fraud."},{"w":"anodyne","pos":"n., adj.","d":"Medicine that relieves pain (noun); soothing, relieving pain (adj)","ex":"His speech was carefully anodyne, avoiding any controversial topic."},{"w":"anoint","pos":"v.","d":"Rub or sprinkle oil on; make sacred, such as by a ceremony that includes applying oil to someone","ex":"The priest anointed the newborn during the ceremony."},{"w":"anomaly","pos":"n.","d":"Deviation from what is common; inconsistency","ex":"The data point was flagged as an anomaly and excluded from the average."},{"w":"antagonize","pos":"v.","d":"Make hostile or unfriendly","ex":"He didn't mean to antagonize his neighbors with the late-night noise."},{"w":"antedate","pos":"v.","d":"Be older than, precede in time; assign to an earlier date","ex":"The document appears to antedate the treaty by several years."},{"w":"antithetical","pos":"adj.","d":"Directly opposed, opposite; involving antithesis (the rhetorical act of placing two phrases opposite one another for contrast, as in love me or hate me)","ex":"Cheating is antithetical to everything the coach teaches the team."},{"w":"apathy","pos":"n.","d":"Not caring; absence of feeling; lack of interest or concern","ex":"Voter apathy contributed to the record-low turnout."},{"w":"apocryphal","pos":"adj.","d":"Of questionable authenticity; false","ex":"The story about the founder sleeping in his car is probably apocryphal."},{"w":"apostate","pos":"n., adj.","d":"Person who deserts a party, cause, religion, etc.","ex":"The group branded him an apostate after he left the movement."},{"w":"apostle","pos":"n.","d":"Pioneer of a reform movement (originally, an early follower of Jesus)","ex":"She became an apostle of the slow-food movement in her city."},{"w":"apposite","pos":"adj.","d":"Highly appropriate, suitable, or relevant","ex":"His apposite remark ended the debate in a single sentence."},{"w":"apprise","pos":"v.","d":"Inform, give notice to","ex":"Please apprise me of any changes to the schedule."},{"w":"approbation","pos":"n.","d":"Praise or approval, especially formal approval","ex":"The young violinist basked in the audience's approbation."},{"w":"appropriate","pos":"v., adj.","d":"Set aside or authorize (such as money) for a particular purpose; take for one's own use","ex":"The council voted to appropriate funds for the new library."},{"w":"arbiter","pos":"n.","d":"Judge, umpire, person empowered to decide matters at hand","ex":"The judge served as the final arbiter of the dispute."},{"w":"arcane","pos":"adj.","d":"Known or understood by only a few; obscure, secret","ex":"The tax code is full of arcane rules few accountants fully understand."},{"w":"archaic","pos":"adj.","d":"Characteristic of an earlier period, ancient, primitive","ex":"The archaic language of the old law confused modern readers."},{"w":"ardent","pos":"adj.","d":"Very passionate, devoted, or enthusiastic","ex":"He remained an ardent supporter of the team through every losing season."},{"w":"arduous","pos":"adj.","d":"Very difficult, strenuous; severe, hard to endure","ex":"The climb to the summit was long and arduous."},{"w":"arrogate","pos":"v.","d":"Claim or take presumptuously or without the right to do so","ex":"The general arrogated powers that were never granted to him."},{"w":"articulate","pos":"adj., v.","d":"Using language in a clear, fluent way (adj); speak distinctly or give clarity to an idea (verb)","ex":"She is remarkably articulate for someone so young."},{"w":"artifact","pos":"n.","d":"Any object made by humans, especially those from an earlier time, such as those excavated by archaeologists","ex":"Archaeologists uncovered a bronze artifact near the riverbank."},{"w":"artless","pos":"adj.","d":"Free of deceit or craftiness, natural, genuine; lacking skill or knowledge, crude, uncultured","ex":"His artless honesty was refreshing after so many polished excuses."},{"w":"ascertain","pos":"v.","d":"Find out with certainty","ex":"Investigators worked to ascertain the cause of the fire."},{"w":"asc te, against the rules of taste or politeness","ex":"It would be unseemly to discuss the inheritance at the funeral."},{"w":"unsparing","pos":"adj.","d":"Generous, lavish (as in not sparing any help or gifts to others); unmerciful, harsh (as in not sparing any criticism)","ex":"The review was unsparing in its criticism of the film's pacing."},{"w":"untempered","pos":"adj.","d":"Not toned down; not moderated, controlled, or counterbalanced","ex":"His untempered ambition eventually alienated most of his allies."},{"w":"upbraid","pos":"v.","d":"Find fault with, criticize or scold severely","ex":"She upbraided the intern for missing the deadline without warning anyone."},{"w":"usury","pos":"n.","d":"Charging interest on a loan, esp. charging illegally high or excessive interest","ex":"The lender was accused of usury after charging triple-digit interest rates."},{"w":"vacillate","pos":"v.","d":"Waver in one's mind or opinions, be indecisive","ex":"He vacillated for weeks before finally accepting the job offer."},{"w":"vanguard","pos":"n.","d":"Leading units at the front of an army; leaders in a trend or movement, people on the \"cutting edge\"; the forefront of a trend or movement","ex":"The company is at the vanguard of the shift to renewable energy."},{"w":"variegated","pos":"v., adj.","d":"Varied in color, having multicolored patches or spots; diverse","ex":"The garden was full of variegated leaves in shades of green and cream."},{"w":"venerate","pos":"v.","d":"Revere, regard with deep respect and awe","ex":"The village still venerates the founder who built its first well."},{"w":"veracity","pos":"n.","d":"Truthfulness, accuracy; habitual adherence to the truth","ex":"Editors questioned the veracity of the anonymous source's claims."},{"w":"verbose","pos":"adj.","d":"Wordy","ex":"His verbose emails often buried the one important sentence."},{"w":"verdant","pos":"adj.","d":"Green, such as with vegetation, plants, grass, etc.; young and inexperienced","ex":"The valley was verdant after weeks of spring rain."},{"w":"verisimilar","pos":"adj.","d":"Having the appearance of truth, probable","ex":"The special effects gave the battle scene a verisimilar quality."},{"w":"vernal","pos":"adj.","d":"Relating to the spring; fresh, youthful","ex":"The vernal equinox marks the official start of spring."},{"w":"vestige","pos":"n.","d":"Trace or sign of something that once existed","ex":"A few stone walls are the only vestige of the old settlement."},{"w":"vex","pos":"v.","d":"annoy or bother; puzzle or distress","ex":"The unanswered question continued to vex researchers for years."},{"w":"via","pos":"prep.","d":"Through, by means of, by way of (by a route that goes through or touches)","ex":"They traveled to Rome via Paris and Milan."},{"w":"viable","pos":"adj.","d":"Capable of living (or growing, developing, etc.); practical, workable","ex":"The startup needed a viable plan to survive its first winter."},{"w":"vicissitude","pos":"n.","d":"Changes or variations over time, esp. regular changes from one thing to another","ex":"The memoir traces the vicissitudes of a long career in journalism."},{"w":"vim","pos":"n.","d":"Pep, enthusiasm, vitality, lively spirit","ex":"She approached every project with unusual vim and energy."},{"w":"vintage","pos":"adj., n.","d":"Related to items of high quality from a previous era, old-fashioned, antique (adj); the wine of a particular year (noun)","ex":"He collects vintage cameras from the early twentieth century."},{"w":"virtual","pos":"adj.","d":"Existing only in the mind or by means of a computer network; existing in results or in essence but not officially or in name","ex":"The conference moved to a virtual format during the outbreak."},{"w":"virulent","pos":"adj.","d":"Extremely infectious, poisonous, etc.; hateful, bitterly hostile","ex":"A virulent strain of the flu spread quickly through the dormitory."},{"w":"viscid or viscous","pos":"adj.","d":"Thick, adhesive, or covered in something sticky","ex":"The t","ex":"The old policy allowed refunds, whereas the new one does not."},{"w":"whet","pos":"v.","d":"Stimulate, make keen or eager (esp. of an appetite)","ex":"The trailer was enough to whet everyone's appetite for the sequel."},{"w":"whimsical","pos":"adj.","d":"Marked or motivated by whims (odd, fanciful ideas); erratic, unpredictable","ex":"The children's book featured whimsical illustrations of talking animals."},{"w":"whitewash","pos":"n., v.","d":"A substance used to whiten walls, wood, etc. (noun); deception, covering up of wrongs, errors, misdeeds, etc. (verb)","ex":"Critics accused the report of being a whitewash of the agency's failures."},{"w":"wily","pos":"adj.","d":"Crafty, cunning, characterized by tricks or artifice","ex":"The wily fox slipped past the guard dogs without a sound."},{"w":"winnow","pos":"v., n.","d":"Sift, analyze critically, separate the useful part from the worthless part","ex":"Editors winnow hundreds of submissions down to a handful each issue."},{"w":"winsome","pos":"adj.","d":"Charming, engaging, esp. in a sweet and innocent way","ex":"Her winsome smile put the nervous patient at ease."},{"w":"wizened","pos":"adj.","d":"Withered, shriveled","ex":"The wizened old sailor had a story for every scar on his hands."},{"w":"xenophobia","pos":"n.","d":"Fear or hatred of foreigners or that which is foreign","ex":"The novel confronts the xenophobia faced by early immigrants."},{"w":"yoke","pos":"n., v.","d":"A burden or something that oppresses; a frame for attaching animals (such as oxen) to each other and to a plow or other equipment to be pulled, or a bar across a person's shoulders to help carry buckets of water, etc. (noun); to unite together or to burden (verb)","ex":"The oxen strained against the wooden yoke as they pulled the cart."},{"w":"zeal","pos":"n.","d":"Great fervor or enthusiasm for a cause, person, etc.; tireless diligence in furthering that cause; passion, ardor","ex":"She approached the new project with real zeal from day one."},{"w":"zenith","pos":"n.","d":"High point, culmination","ex":"The empire reached its zenith just before the long decline began."}];

let deckOrder = WORDS.map((_, i) => i);
let pos = 0;
let flipped = false;
let marks = {}; // index -> 'known' | 'review'

const cardEl = document.getElementById('card');
const wordFront = document.getElementById('wordFront');
const posFront = document.getElementById('posFront');
const wordBack = document.getElementById('wordBack');
const posBack = document.getElementById('posBack');
const defBack = document.getElementById('defBack');
const exBack = document.getElementById('exBack');
const idxFront = document.getElementById('idxFront');
const idxBack = document.getElementById('idxBack');
const posLabel = document.getElementById('posLabel');
const totalLabel = document.getElementById('totalLabel');
const progressFill = document.getElementById('progressFill');
const knownCount = document.getElementById('knownCount');
const reviewCount = document.getElementById('reviewCount');
const filterSelect = document.getElementById('filterSelect');

function currentDeck(){
  const f = filterSelect.value;
  if(f === 'all') return deckOrder;
  if(f === 'unmarked') return deckOrder.filter(i => !marks[i]);
  return deckOrder.filter(i => marks[i] === f);
}

function pad(n){ return String(n).padStart(3,'0'); }

function render(){
  const deck = currentDeck();
  if(deck.length === 0){
    wordFront.textContent = '—';
    posFront.textContent = '';
    defBack.textContent = 'No cards match this filter.';
    exBack.textContent = '';
    wordBack.textContent = '';
    posBack.textContent = '';
    idxFront.textContent = '000 / 000';
    idxBack.textContent = '000 / 000';
    posLabel.textContent = '0';
    totalLabel.textContent = String(deck.length);
    progressFill.style.width = '0%';
    updateCounts();
    return;
  }
  if(pos >= deck.length) pos = deck.length - 1;
  if(pos < 0) pos = 0;
  const wi = deck[pos];
  const entry = WORDS[wi];
  const label = pad(wi+1) + ' / 995';
  wordFront.textContent = entry.w;
  posFront.textContent = entry.pos;
  wordBack.textContent = entry.w;
  posBack.textContent = entry.pos;
  defBack.textContent = entry.d;
  exBack.textContent = '\u201c' + entry.ex + '\u201d';
  idxFront.textContent = label;
  idxBack.textContent = label;
  posLabel.textContent = String(pos+1);
  totalLabel.textContent = String(deck.length);
  progressFill.style.width = ((pos+1)/deck.length*100) + '%';
  updateCounts();
}

function updateCounts(){
  let k=0, r=0;
  for(const key in marks){
    if(marks[key]==='known') k++;
    else if(marks[key]==='review') r++;
  }
  knownCount.textContent = k;
  reviewCount.textContent = r;
}

function flip(){
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
}

function goTo(newPos){
  flipped = false;
  cardEl.classList.remove('flipped');
  pos = newPos;
  render();
}

function next(){
  const deck = currentDeck();
  if(pos < deck.length - 1) goTo(pos+1);
  else goTo(0);
}
function prev(){
  const deck = currentDeck();
  if(pos > 0) goTo(pos-1);
  else goTo(deck.length-1);
}

function shuffle(){
  for(let i = deckOrder.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [deckOrder[i], deckOrder[j]] = [deckOrder[j], deckOrder[i]];
  }
  goTo(0);
}

function mark(type){
  const deck = currentDeck();
  const wi = deck[pos];
  if(wi === undefined) return;
  marks[wi] = (marks[wi] === type) ? undefined : type;
  if(marks[wi] === undefined) delete marks[wi];
  updateCounts();
  const wasLast = pos === deck.length - 1;
  if(filterSelect.value !== 'all'){
    // filter membership may change; re-render carefully
    const newDeck = currentDeck();
    if(pos >= newDeck.length) pos = Math.max(0, newDeck.length - 1);
  }
  render();
  if(!wasLast) setTimeout(next, 180);
}

cardEl.addEventListener('click', flip);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('knownBtn').addEventListener('click', () => mark('known'));
document.getElementById('reviewBtn').addEventListener('click', () => mark('review'));
document.getElementById('resetBtn').addEventListener('click', () => { marks = {}; updateCounts(); });
filterSelect.addEventListener('change', () => goTo(0));

document.getElementById('jumpBtn').addEventListener('click', doJump);
document.getElementById('jumpInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') doJump(); });

function doJump(){
  const q = document.getElementById('jumpInput').value.trim().toLowerCase();
  if(!q) return;
  let targetIdx = -1;
  const asNum = parseInt(q, 10);
  if(!isNaN(asNum) && asNum >= 1 && asNum <= WORDS.length){
    targetIdx = asNum - 1;
  } else {
    targetIdx = WORDS.findIndex(e => e.w.toLowerCase().startsWith(q));
  }
  if(targetIdx === -1) return;
  filterSelect.value = 'all';
  const deck = currentDeck();
  const p = deck.indexOf(targetIdx);
  if(p !== -1) goTo(p);
}

document.addEventListener('keydown', (e) => {
  if(document.activeElement === document.getElementById('jumpInput')) return;
  if(e.code === 'ArrowRight') next();
  else if(e.code === 'ArrowLeft') prev();
  else if(e.code === 'Space'){ e.preventDefault(); flip(); }
});

render();
</script>
